[pytest]
testpaths = tests
# tests/legacy_pyssl holds the suite for the removed Python-`ssl` TLS
# generation. It imports modules that no longer exist, so collecting it
# aborts the whole run. See tests/legacy_pyssl/README.md.
norecursedirs = legacy_pyssl
# tests/ is added to sys.path so `from conftest import free_port` works and the
# backend package layout (core/, protocols/) imports the same way main.py does.
pythonpath = . tests
asyncio_mode = auto
markers =
    tls_dataplane: opens a real TLS connection to the running NGINX listener.
        Skips itself when the listener is down. Deselect with
        `-m "not tls_dataplane"` to run only the offline suite.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
log_cli_level = WARNING
