# /etc/swanctl/swanctl.conf
#
# QUANSEC — StrongSwan IKEv2 configuration with Kyber1024 PQC
#
# This configures a real IPsec tunnel using:
#   - IKEv2 (RFC 7296)
#   - Kyber1024 (ML-KEM-1024, FIPS 203 Level 5) for key exchange
#   - AES-256-GCM for encryption
#   - SHA-384 for PRF/integrity
#   - X.509 certificates for authentication
#
# Copy to: /etc/swanctl/swanctl.conf
# Then run: sudo swanctl --load-all
#
# Requires StrongSwan 5.9.6+ with ml-kem plugin
# Install: sudo apt install strongswan-swanctl strongswan-pki

connections {

    # ── Example: site-to-site tunnel with Kyber1024 ──────────────────────
    quansec-pqc {
        version = 2      # IKEv2 mandatory for PQC

        # IKE proposal: Kyber1024 for KEM + AES-256-GCM + SHA-384
        # Format: enc-prf-dh[+additional_ke]
        # The +mlkem1024 appends Kyber1024 as additional key exchange (RFC 9370)
        proposals = aes256gcm128-prfsha384-ecp384+mlkem1024

        # Tunnel endpoints — replace with your actual IPs
        local_addrs  = 192.168.1.1   # this machine
        remote_addrs = 192.168.2.1   # remote peer

        # Authentication via X.509 certificates
        local {
            auth = pubkey
            certs = local-cert.pem
            id = "CN=quansec-local"
        }
        remote {
            auth = pubkey
            certs = remote-cert.pem
            id = "CN=quansec-remote"
        }

        children {
            net {
                # ESP proposal: AES-256-GCM (no separate integrity in AEAD mode)
                esp_proposals = aes256gcm128-ecp384

                # Traffic selectors — what traffic this tunnel carries
                local_ts  = 10.0.0.0/8
                remote_ts = 10.1.0.0/8

                # Always UP — reconnect automatically
                start_action = start
                dpd_action    = restart
            }
        }

        # DPD — detect dead peers after 30s
        dpd_delay  = 30s
        dpd_timeout = 90s

        keyingtries = 0   # retry forever
    }

    # ── Minimal test tunnel (pre-shared key, no certs needed for testing) ─
    quansec-test {
        version = 2
        proposals = aes256gcm128-prfsha384-curve25519+mlkem1024

        local_addrs  = 127.0.0.1
        remote_addrs = 127.0.0.2

        local  { auth = psk; }
        remote { auth = psk; }

        children {
            test {
                esp_proposals = aes256gcm128
                start_action  = trap
            }
        }
    }
}

# Pre-shared keys (for test tunnel above)
secrets {
    ike-test {
        id-local  = 127.0.0.1
        id-remote = 127.0.0.2
        secret    = "change-this-psk-in-production"
    }
}
